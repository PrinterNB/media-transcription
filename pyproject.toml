[project]
name = "media-transcription"
version = "0.1.0"
description = "Local-network media transcription service: Canary/Whisper ASR + pyannote diarization + Ollama naming"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "soundfile",
    # torch/torchaudio are pinned to the last version that keeps pyannote 3.4.0
    # importable — the constraint is platform-neutral, not device-related:
    #   - torchaudio 2.11 (the newest) moved `AudioMetaData` into the torchcodec
    #     backend and dropped it from torchaudio, so `import pyannote.audio`
    #     fails at module load.
    #   - pyannote 4.x needs torchcodec outright.
    #   - 2.8.0 keeps `AudioMetaData`; torch here uses `mps` and falls back to
    #     `cpu`.
    # The pins are unlabelled, not `+cpu`: the `+cpu`/`+cuNNN` wheels at
    # download.pytorch.org are Linux/Windows builds only (uv rejects them for
    # the `macosx_11_0_arm64` tag here), and PyPI ships the mac wheel as plain
    # 2.8.0.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    # Canary-qwen-2.5b is a Qwen2-era model; freeze transformers to 4.x to
    # avoid 5.x breaking changes to AutoModelForCausalLM / word_timestamps_mapper.
    "transformers>=4.41,<5",
    "accelerate",
    "pyannote.audio==3.4.0",
    "faster-whisper",
    # Canary-qwen-2.5b is a NeMo speech-LM (SALM), not a plain HF causal LM —
    # the NeMo loader is the only proven way to load it (docs/spike-notes.md).
    # NOTE: the PyPI distribution is `nemo_toolkit` (provides the `nemo`
    # top-level package). `nemo` on PyPI is an unrelated NIST Django app that
    # installs a shadowing all-caps `NEMO` package and breaks `import nemo`.
    # The plain `speechlm2` extra drags in the TTS text-processing stack
    # (nemo_text_processing -> pynini, a C++ extension we never use and that
    # has to be built from source); the SALM import only needs the core + asr
    # + speechlm2-only groups.
    "nemo_toolkit[asr,speechlm2-only]==3.0.0",
    "pytest",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    # Terminal QR for the startup banner. Pinned <9: the 7->8 line already
    # renamed print_in_terminal -> print_ascii/print_tty.
    "qrcode>=8.2,<9",
]

# nemo_automodel requires `torchao` unpinned; the latest (0.18.0) imports
# `ScalingType` from torch.nn.functional, which only exists in torch >= 2.9,
# and crashes the whole lightning/torchmetrics/transformers import chain on
# our pinned torch 2.8.0. 0.13.0 is the newest that imports cleanly under it.
[tool.uv]
override-dependencies = ["torchao==0.13.0"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
